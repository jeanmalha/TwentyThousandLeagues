<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Sheets</title>
<style>
  :root {
    --bg: #0b141b;
    --panel: #111f29;
    --panel-2: #162836;
    --line: #24404f;
    --text: #e6dfcf;
    --muted: #97a8ad;
    --brass: #c9a24a;
    --brass-dim: #8a6d2c;
    --teal: #3b8a96;
    --warn: #d98a5f;
    --quote-bg: #0f1c25;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); }
  a { color: inherit; }

  .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }

  /* Cast list */
  nav { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { font: 600 13px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); margin: 0 6px 4px; }
  .brand-sub { color: var(--muted); font-size: 12px; margin: 0 6px 18px; }
  .group { margin: 16px 6px 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .cast-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 6px; text-decoration: none; color: var(--text); }
  .cast-item:hover { background: var(--panel-2); }
  .cast-item[aria-current="true"] { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--brass); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .cast-name { font-size: 14px; }
  .cast-acts { margin-left: auto; font: 11px var(--mono); color: var(--muted); }

  /* Sheet */
  main { padding: 32px 40px 64px; max-width: 1180px; }
  .sheet-head { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
  .tier { display: inline-block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--bg); background: var(--brass); padding: 2px 8px; border-radius: 3px; }
  h1 { font: 600 40px/1.1 var(--serif); margin: 10px 0 4px; }
  .fr-title { font: italic 16px var(--serif); color: var(--muted); }
  .concept { font: 18px/1.5 var(--serif); margin: 14px 0 0; max-width: 62ch; }
  .acts { display: flex; gap: 6px; }
  .act { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; font: 600 13px var(--mono); color: var(--muted); }
  .act.on { border-color: var(--brass); color: var(--brass); }
  .acts-label { font-size: 11px; color: var(--muted); text-align: right; margin-top: 6px; letter-spacing: .1em; text-transform: uppercase; }

  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 28px; margin-top: 26px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
  .card + .card { margin-top: 16px; }
  h2 { font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); margin: 0 0 12px; }

  .art { aspect-ratio: 3 / 4; border-radius: 6px; overflow: hidden; background: var(--quote-bg); border: 1px dashed var(--line); display: grid; place-items: center; position: relative; }
  .art img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  .art svg { width: 78%; height: auto; }
  .art-hint { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font: 11px var(--mono); color: var(--muted); }

  dl.stats { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
  dl.stats dt { color: var(--muted); }
  dl.stats dd { margin: 0; }

  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 48px; }
  .swatch i { display: block; height: 40px; border-radius: 4px; border: 1px solid rgba(255,255,255,.08); }
  .swatch span { display: block; font: 10px var(--mono); color: var(--muted); margin-top: 4px; }

  .verb { display: flex; gap: 12px; align-items: baseline; }
  .verb b { font: 600 20px var(--serif); color: var(--brass); }
  .verb span { color: var(--muted); font-size: 14px; }

  blockquote { margin: 0 0 10px; padding: 10px 14px; background: var(--quote-bg); border-left: 2px solid var(--teal); font: italic 15.5px/1.5 var(--serif); }
  blockquote cite { display: block; font: normal 11px var(--mono); color: var(--muted); margin-top: 6px; }
  blockquote:last-child { margin-bottom: 0; }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  ul.tags { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  ul.tags li { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  ul.plain { margin: 0; padding-left: 18px; }
  ul.plain li + li { margin-top: 4px; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 12px 0 4px; }
  .label:first-child { margin-top: 0; }
  p { margin: 0; }
  .note-warn { border-left: 2px solid var(--warn); padding-left: 10px; }
  .empty { color: var(--muted); font-style: italic; }

  .toolbar { display: flex; gap: 10px; margin-top: 14px; }
  button { font: 13px var(--sans); color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--brass-dim); }

  .source { margin-top: 36px; font-size: 12px; color: var(--muted); }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    nav { position: static; height: auto; }
    main { padding: 20px 16px 48px; }
    .grid, .two { grid-template-columns: 1fr; }
    .sheet-head { grid-template-columns: 1fr; }
    h1 { font-size: 32px; }
  }
  @media print {
    nav, .toolbar, .art-hint { display: none; }
    .app { display: block; }
    body { background: #fff; color: #111; }
    .card, blockquote { background: #fff; border-color: #bbb; }
    main { max-width: none; padding: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <nav aria-label="Cast">
    <p class="brand">Twenty Thousand Leagues</p>
    <p class="brand-sub">Character design sheets · source: Verne, French text</p>
    <div id="cast"></div>
  </nav>
  <main id="sheet" aria-live="polite"></main>
</div>

<script src="characters.js"></script>
<script>
  const TIERS = [
    ["playable", "Playable"],
    ["npc-major", "Major NPC"],
    ["npc-minor", "Supporting"],
    ["npc-group", "Groups"],
    ["npc-cameo", "Cameos"]
  ];
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const byId = Object.fromEntries(CAST.map(c => [c.id, c]));

  function renderCast(current) {
    document.getElementById("cast").innerHTML = TIERS.map(([tier, label]) => {
      const list = CAST.filter(c => c.tier === tier);
      if (!list.length) return "";
      return `<div class="group">${label}</div>` + list.map(c => `
        <a class="cast-item" href="#${c.id}" aria-current="${c.id === current}">
          <span class="dot" style="background:${c.palette[Math.min(3, c.palette.length - 1)]}"></span>
          <span class="cast-name">${esc(c.name)}</span>
          <span class="cast-acts">${c.acts.join("·")}</span>
        </a>`).join("");
    }).join("");
  }

  // Placeholder bust silhouette in the character's palette, shown until art/<id>.png exists.
  function placeholder(c) {
    const p = c.palette;
    const wide = { ned: 1.25, second: 1.2, conseil: 1.0, aronnax: 0.95, nemo: 0.9 }[c.id] || 1;
    const sw = 70 * wide;
    return `<svg viewBox="0 0 200 260" role="img" aria-label="Placeholder silhouette">
      <rect x="0" y="0" width="200" height="260" fill="${p[0]}"/>
      <path d="M${100 - sw} 260 Q${100 - sw} 170 100 165 Q${100 + sw} 170 ${100 + sw} 260 Z" fill="${p[1]}"/>
      <ellipse cx="100" cy="112" rx="40" ry="50" fill="${p[p.length > 3 ? 3 : 2]}" opacity=".85"/>
      ${c.id === "nemo" || c.id === "second" ? `<path d="M58 84 Q100 40 142 84 Q100 70 58 84 Z" fill="${p[2]}"/>` : ""}
    </svg>`;
  }

  const quotes = (arr) => arr && arr.length
    ? arr.map(x => `<blockquote lang="fr">« ${esc(x.q.replace(/^«\s*|\s*»$/g, ""))} »<cite>${esc(x.ref)}</cite></blockquote>`).join("")
    : `<p class="empty">No direct description in the text.</p>`;
  const tags = arr => arr && arr.length ? `<ul class="tags">${arr.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : `<p class="empty">—</p>`;
  const plain = arr => arr && arr.length ? `<ul class="plain">${arr.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : `<p class="empty">—</p>`;

  function renderSheet(c) {
    const tierLabel = (TIERS.find(t => t[0] === c.tier) || [, c.tier])[1];
    document.title = `${c.name} · Character Sheets`;
    document.getElementById("sheet").innerHTML = `
      <header class="sheet-head">
        <div>
          <span class="tier">${esc(tierLabel)}</span>
          <h1>${esc(c.name)}</h1>
          <div class="fr-title" lang="fr">${esc(c.title)}</div>
          <p class="concept">${esc(c.concept)}</p>
        </div>
        <div>
          <div class="acts">${[1, 2, 3, 4].map(a => `<span class="act ${c.acts.includes(a) ? "on" : ""}">${a}</span>`).join("")}</div>
          <div class="acts-label">Acts</div>
        </div>
      </header>

      <div class="grid">
        <aside>
          <div class="card">
            <h2>Portrait</h2>
            <div class="art" id="art">
              <img src="art/${c.id}.png" alt="${esc(c.name)} portrait"
                   onerror="this.parentNode.innerHTML = placeholder(byId['${c.id}']) + '<div class=art-hint>add art/${c.id}.png</div>'">
            </div>
          </div>
          <div class="card">
            <h2>At a glance</h2>
            <dl class="stats">
              <dt>Age</dt><dd>${esc(c.stats.age)}</dd>
              <dt>Height</dt><dd>${esc(c.stats.height)}</dd>
              <dt>Origin</dt><dd>${esc(c.stats.origin)}</dd>
              <dt>First seen</dt><dd>${esc(c.stats.firstSeen)}</dd>
            </dl>
          </div>
          <div class="card">
            <h2>Verb</h2>
            <div class="verb"><b>${esc(c.verb.name)}</b></div>
            <p style="margin-top:6px;color:var(--muted);font-size:14px">${esc(c.verb.note)}</p>
          </div>
          <div class="card">
            <h2>Palette</h2>
            <div class="swatches">${c.palette.map(h => `<div class="swatch"><i style="background:${h}"></i><span>${h}</span></div>`).join("")}</div>
          </div>
        </aside>

        <section>
          <div class="card">
            <h2>What Verne says</h2>
            ${quotes(c.verne)}
          </div>

          <div class="card">
            <h2>Character</h2>
            <div class="label">Personality</div>${tags(c.personality)}
            <div class="two" style="margin-top:12px">
              <div><div class="label">Wants</div><p>${esc(c.wants)}</p></div>
              <div><div class="label">Fears</div><p>${esc(c.fears)}</p></div>
            </div>
            <div class="label">Arc</div><p>${esc(c.arc)}</p>
          </div>

          <div class="card">
            <h2>Voice</h2>
            <p>${esc(c.voice.register)}</p>
            <div class="label">Verbal tics</div>${tags(c.voice.tics)}
            ${c.voice.lines && c.voice.lines.length ? `<div class="label">Signature lines</div>${quotes(c.voice.lines)}` : ""}
          </div>

          <div class="card">
            <h2>Visual design</h2>
            <div class="two">
              <div><div class="label">Build</div><p>${esc(c.visual.build)}</p></div>
              <div><div class="label">Face</div><p>${esc(c.visual.face)}</p></div>
              <div><div class="label">Costume</div><p>${esc(c.visual.costume)}</p></div>
              <div><div class="label">Silhouette</div><p>${esc(c.visual.silhouette)}</p></div>
            </div>
            <div class="label">Props</div>${tags(c.visual.props)}
          </div>

          <div class="card">
            <h2>Portrait brief</h2>
            <div class="label">Expressions</div>${tags(c.portrait.expressions)}
            <div class="two" style="margin-top:12px">
              <div><div class="label">Idle</div><p>${esc(c.portrait.idle)}</p></div>
              <div><div class="label">Special</div><p>${esc(c.portrait.special)}</p></div>
            </div>
          </div>

          <div class="two" style="margin-top:16px">
            <div class="card" style="margin:0"><h2>Design notes</h2>${c.notes && c.notes.length ? `<ul class="plain">${c.notes.map(n => `<li class="${/sensitiv|rights/i.test(n) ? "note-warn" : ""}">${esc(n)}</li>`).join("")}</ul>` : `<p class="empty">—</p>`}</div>
            <div class="card" style="margin:0"><h2>Open questions</h2>${plain(c.open)}</div>
          </div>

          <div class="toolbar"><button onclick="window.print()">Print this sheet</button></div>
        </section>
      </div>
      <p class="source">Quotes from Jules Verne, <i>Vingt mille lieues sous les mers</i>, Hetzel, French original (public domain), docs/source/verne/fr-verne-5097.txt. "I-8" = Part 1, chapter VIII.</p>`;
  }

  function route() {
    const id = location.hash.slice(1);
    const c = byId[id] || CAST[0];
    renderCast(c.id);
    renderSheet(c);
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
